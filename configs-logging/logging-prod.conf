[loggers]
keys=root,alembic_plugins,passlib

# Only warnings: alembic lists its plugins on every start, passlib logs its setup on import
[logger_alembic_plugins]
level=WARNING
handlers=
qualname=alembic.runtime.plugins

[logger_passlib]
level=WARNING
handlers=
qualname=passlib

[handlers]
keys=fileH

[formatters]
keys=simple

[logger_root]
level=DEBUG
handlers=fileH

[handler_fileH]
class=FileHandler
level=DEBUG
formatter=simple
args=('.logs/app-server.log', 'a')

[formatter_simple]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=
