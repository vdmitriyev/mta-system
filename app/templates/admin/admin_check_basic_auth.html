{% extends "layout.html" %}
{% block content %}

		<div class="card text-center pt-1 mt-1">
          <div class="card-body">
            <h5 class="card-title">Check of Basic Access</h5>
          </div>
        </div>


	<table class="table table-striped mt-2">
		<thead>
			<tr>
			  <th scope="col" style="width: 1.00%">#</th>
			  <th scope="col" style="width: 5.00%">Name</th>
			  <th scope="col" style="width: 5.00%">Course Code</th>
			  <th scope="col" style="width: 5.00%">OpenRefine User</th>
			  <th scope="col" style="width: 5.00%">OpenRefine Verdict</th>
			</tr>
		</thead>
		<tbody>
			{% for item in basicAuthChecks %}
				<tr>
					<th scope="row">{{loop.index}}</th>
					<td>{{item.name}}</td>
					<td>{{item.courseCode}}</td>
					<td>{{item.openRefineUser}}</td>
					<td>{{item.orCheckVerdict}}</td>
				</tr>
			{% endfor %}
		</tbody>
	</table>

<style>
* {
    outline: 0px solid red;
}

.vertical{
	 transform: rotate(360deg);
	 writing-mode: vertical-rl;
	 margin-right:10px;
}

</style>

{% endblock %}
