# Production: mta-system behind nginx (HTTPS), with the services for the students.
#   task prod:up
#   (docker compose --env-file versions.env -f compose.prod.yaml -f compose.services.yml up -d --build)
#
# sqlmate and SurveyLite have their own compose files in provision/ (task sqlmate:up,
# task surveylite:up). Start them after mta-system: they join its network.
#
# nginx and PostgreSQL publish ports to all interfaces. The app is reachable from nginx only.
name: mta-system-prod

services:

  webapp:
    build: .
    image: mta-system:latest
    container_name: mta-system-app
    restart: unless-stopped
    env_file:
      - ${ENV_FILE_NAME:-envs/.env}
    environment:
      TARGET_SERVER: production
      TZ: Europe/Berlin
      # worker processes of uvicorn
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-4}"
      # network of this project: the app starts the service containers of the students in it
      DOCKER_NETWORK_NAME: mta-system-prod_mtas-network
    volumes:
      - ./data:/mta-system/data # SQLite database (MTAS_DB_PATH)
      - ./.logs:/mta-system/.logs
      - ./setup:/mta-system/setup:ro # initial data (initial_exercises.csv)
      - ./.htpasswd_nginx:/mta-system/.htpasswd_nginx
      - /var/run/docker.sock:/var/run/docker.sock # starts and stops the service containers
    expose:
      - "5151"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5151/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - mtas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    build: ./provision/nginx
    image: mta-system-nginx:latest
    env_file:
      # shared secret with pgAdmin 4 (task app:init-env creates the file)
      - path: envs/pgadmin4-proxy.env
        required: false
    container_name: mta-system-nginx
    restart: unless-stopped
    depends_on:
      webapp:
        condition: service_healthy
      pgadmin4-service:
        condition: service_started
    environment:
      HTTPS_PORT: "${HTTPS_PORT:-443}"
      # Let's Encrypt certificate certbot/conf/live/<SSL_CERT_NAME>.
      # task prod:* sets it to SERVER_FQDN of the app env file. Empty: self-signed.
      SSL_CERT_NAME: "${SSL_CERT_NAME:-}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./provision/nginx/nginx_part_openrefine.config:/etc/nginx/conf.d/nginx_part_openrefine.config:ro
      - ./.htpasswd_nginx:/.htpasswd_nginx:ro
      - ./.logs/nginx:/var/log/nginx
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
    networks:
      - mtas-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL of the students: reachable from outside, e.g. from their SQL clients.
  # The login of each user needs a password. Use a strong POSTGRES_PASSWORD in
  # envs/postgresql-service.env and allow the port in the firewall only if needed.
  postgresql-service:
    restart: unless-stopped
    ports:
      - "${POSTGRESQL_PUBLIC_PORT:-5432}:5432"

  # pgAdmin 4 at https://<SERVER_FQDN>/pgadmin4/ (nginx)
  pgadmin4-service:
    restart: unless-stopped

  # Gets and renews Let's Encrypt certificates. Runs only on demand:
  #   task prod:cert -- mtas.example.org
  certbot:
    image: certbot/certbot:v5.1.0
    profiles: [certbot]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

networks:
  mtas-network:
