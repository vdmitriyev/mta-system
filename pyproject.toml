[project]
name = "mta-system"
version = "2.4.4"
description = "Modular teaching assistance system: gives students hands-on access to software services"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # web framework
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "itsdangerous==2.2.0",
    "click==8.5.1",
    # settings from environment variables and env files
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    # database of the app (SQLite) and its migrations
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "python-dotenv==1.2.4",
    "email_validator==2.3.0",
    "markdown==3.11.3",
    "libpass==1.9.4",
    # data importers
    "requests==2.34.2",
    "pandas==3.1.1",
    "beautifulsoup4==4.15.0",
    # captcha
    "Pillow==13.0.0",
    # services for the students (PostgreSQL, MariaDB, Docker containers)
    "psycopg2-binary==2.9.13",
    "dbsetupmate==0.8.1",
    "pymysql==1.2.3",
    "docker==7.2.0",
    "psutil==7.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx2==2.16.0",
    "isort==9.0.2",
    "pre-commit==4.7.0",
    "black==26.10.1",
    "bandit==1.9.4",
]

[tool.uv]
# an application, not a library: install only the dependencies
package = false

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
