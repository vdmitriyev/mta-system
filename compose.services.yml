services:

  metabase-service:
   image: metabase/metabase:${METABASE_VERSION:?set it in versions.env and use task, or docker compose --env-file versions.env}
   ports:
       - "127.0.0.1:3000:3000"
   networks:
       - mtas-network

  openrefine-service:
   # versions come from versions.env, the same file that the web app reads
   build:
     context: ./provision/openrefine
     args:
       OPENREFINE_VERSION: ${OPENREFINE_VERSION:?set it in versions.env and use task, or docker compose --env-file versions.env}
   image: openrefine:${OPENREFINE_VERSION:?set it in versions.env and use task, or docker compose --env-file versions.env}
   networks:
       - mtas-network

  postgresql-service:
    image: "postgres:${POSTGRESQL_VERSION:?set it in versions.env and use task, or docker compose --env-file versions.env}"
    env_file:
      - envs/postgresql-service.env # configure postgres service
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg15volume-service:/pgdata
    networks:
      - mtas-network

  pgadmin4-service:
    image: "dpage/pgadmin4:${PGADMIN4_VERSION:?set it in versions.env and use task, or docker compose --env-file versions.env}"
    env_file:
      - envs/pgadmin4-service.env # configures pgadmin4 service
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pga4volume-service:/var/lib/pgadmin
      - type: bind
        source: ./provision/pgadmin4/config_local.py
        target: /pgadmin4/config_local.py
    networks:
      - mtas-network

networks:
    mtas-network:

volumes:
  pg15volume-service:
  pga4volume-service:
