version: '3'

vars:
  PROD_COMPOSE: docker compose -f compose.prod.yaml -f compose.services.yml

tasks:

  build:
    desc: builds the app and nginx images
    cmds:
      - "{{.PROD_COMPOSE}} build"

  up:
    desc: starts mta-system behind nginx
    aliases: [u]
    cmds:
      - mkdir -p data .logs/nginx .htpasswd_nginx certbot/www certbot/conf
      - "{{.PROD_COMPOSE}} up -d --build"

  down:
    desc: stops the production containers
    aliases: [d]
    cmds:
      - "{{.PROD_COMPOSE}} down"

  restart:
    desc: restarts the production containers
    cmds:
      - "{{.PROD_COMPOSE}} restart"

  ps:
    desc: shows the state of the production containers
    cmds:
      - "{{.PROD_COMPOSE}} ps"

  logs:
    desc: shows the logs (one service after --)
    aliases: [l]
    cmds:
      - "{{.PROD_COMPOSE}} logs -f {{.CLI_ARGS}}"

  nginx-reload:
    desc: checks and reloads the nginx config
    aliases: [reload]
    cmds:
      - "{{.PROD_COMPOSE}} exec nginx nginx -t"
      - "{{.PROD_COMPOSE}} exec nginx nginx -s reload"

  nginx-recreate:
    desc: rebuilds and recreates only nginx
    cmds:
      - mkdir -p .logs/nginx .htpasswd_nginx certbot/www certbot/conf
      - "{{.PROD_COMPOSE}} up -d --build --force-recreate --no-deps nginx"

  app-recreate:
    desc: rebuilds and recreates only the app
    cmds:
      - mkdir -p data .logs .htpasswd_nginx
      - "{{.PROD_COMPOSE}} up -d --build --force-recreate --no-deps webapp"
      # nginx looks up the address of the app only at start or reload
      - task: nginx-reload

  migrate:
    desc: applies the migrations to the production database
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli db-upgrade"

  cert:
    desc: "gets a Let's Encrypt certificate (task prod:cert -- <host>)"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Give the host name: task prod:cert -- mtas.example.org"
    cmds:
      - "{{.PROD_COMPOSE}} run --rm certbot certonly --webroot -w /var/www/certbot -d {{.CLI_ARGS}}"

  cert-renew:
    desc: renews the certificates and reloads nginx
    cmds:
      - "{{.PROD_COMPOSE}} run --rm certbot renew --webroot -w /var/www/certbot"
      - task: nginx-reload
