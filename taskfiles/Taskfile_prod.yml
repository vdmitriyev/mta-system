version: '3'

vars:
  PROD_COMPOSE: docker compose -f compose.prod.yaml -f compose.services.yml
  # SERVER_FQDN from the env file of the app (ENV_FILE_NAME)
  SERVER_FQDN:
    sh: |
      test -f "$ENV_FILE_NAME" || exit 0
      tr -d '\r' < "$ENV_FILE_NAME" | sed -nE "s/^[[:space:]]*SERVER_FQDN[[:space:]]*=[[:space:]]*['\"]?([^'\" #]*).*/\1/p" | tail -n 1

env:
  # nginx uses the Let's Encrypt certificate with this name (provision/nginx/ssl-cert.sh)
  SSL_CERT_NAME: '{{.SERVER_FQDN}}'

tasks:

  build:
    desc: builds the app and nginx images
    cmds:
      - "{{.PROD_COMPOSE}} build"

  up:
    desc: starts mta-system behind nginx
    aliases: [u]
    preconditions:
      - sh: test -f envs/pgadmin4-proxy.env
        msg: "envs/pgadmin4-proxy.env is missing (secret of nginx and pgAdmin 4). Run 'task app:init-env': it creates the file and keeps the others"
    cmds:
      - mkdir -p data submissions .logs/nginx .backups .htpasswd_nginx certbot/www certbot/conf
      - "{{.PROD_COMPOSE}} up -d --build"

  down:
    desc: stops the production containers
    aliases: [d]
    cmds:
      - "{{.PROD_COMPOSE}} down"

  restart:
    desc: restarts the production containers
    cmds:
      - "{{.PROD_COMPOSE}} restart"

  ps:
    desc: shows the state of the production containers
    cmds:
      - "{{.PROD_COMPOSE}} ps"

  logs:
    desc: shows the logs (one service after --)
    aliases: [l]
    cmds:
      - "{{.PROD_COMPOSE}} logs -f {{.CLI_ARGS}}"

  nginx-reload:
    desc: checks and reloads the nginx config
    cmds:
      - "{{.PROD_COMPOSE}} exec nginx nginx -t"
      - "{{.PROD_COMPOSE}} exec nginx nginx -s reload"

  nginx-recreate:
    desc: rebuilds and recreates only nginx
    preconditions:
      - sh: test -f envs/pgadmin4-proxy.env
        msg: "envs/pgadmin4-proxy.env is missing (secret of nginx and pgAdmin 4). Run 'task app:init-env': it creates the file and keeps the others"
    cmds:
      - mkdir -p .logs/nginx .htpasswd_nginx certbot/www certbot/conf
      - "{{.PROD_COMPOSE}} up -d --build --force-recreate --no-deps nginx"

  app-recreate:
    desc: rebuilds and recreates only the app
    cmds:
      - mkdir -p data submissions .logs .backups .htpasswd_nginx
      - "{{.PROD_COMPOSE}} up -d --build --force-recreate --no-deps webapp"
      # nginx looks up the address of the app only at start or reload
      - task: nginx-reload

  migrate:
    desc: applies the migrations to the production database
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli db-upgrade"

  start-cronjobs:
    desc: starts the cron jobs (ofelia, provision/ofelia/config.ini)
    cmds:
      - "{{.PROD_COMPOSE}} up -d cronjobs-ofelia"

  restart-cronjobs:
    desc: restarts the cron jobs, after a change in provision/ofelia/config.ini
    cmds:
      - "{{.PROD_COMPOSE}} restart cronjobs-ofelia"

  stop-containers:
    desc: stops the running Metabase and OpenRefine containers of the users (as ofelia does at night)
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli stop-containers {{.CLI_ARGS}}"

  backup:
    desc: copies the production database and the submitted files (tar.gz) to .backups/<date>-<time>-<name>
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli db-backup {{.CLI_ARGS}}"

  export-exercises:
    desc: "writes the exercises as CSV to .backups/<date>-<time>-initial_exercises.csv"
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli export-data-exercises"

  import-exercises:
    desc: "imports setup/initial_exercises.csv; '-- --update' also changes the exercises that exist"
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli import-data-exercises {{.CLI_ARGS}}"

  create-admins:
    desc: "creates the accounts of SYSTEM_ADMINS, prints and e-mails the login data (-- --no-mail)"
    cmds:
      - "{{.PROD_COMPOSE}} exec webapp python -m app.cli create-admins {{.CLI_ARGS}}"

  cert:
    desc: "gets a Let's Encrypt certificate for SERVER_FQDN"
    preconditions:
      - sh: test -n "{{.SERVER_FQDN}}" && test "{{.SERVER_FQDN}}" != localhost
        msg: "Set SERVER_FQDN in {{.ENV_FILE_NAME}} (or choose the file with ENV_FILE_NAME=...)"
    cmds:
      - "{{.PROD_COMPOSE}} run --rm certbot certonly --webroot -w /var/www/certbot --cert-name {{.SERVER_FQDN}} -d {{.SERVER_FQDN}}"
      # nginx picks the certificate on start
      - "{{.PROD_COMPOSE}} restart nginx"

  cert-renew:
    desc: renews the certificates and reloads nginx
    cmds:
      - "{{.PROD_COMPOSE}} run --rm certbot renew --webroot -w /var/www/certbot"
      - task: nginx-reload
