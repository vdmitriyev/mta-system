version: '3'

# Images of the services that the app starts for each user.
# The versions come from versions.env (loaded by Taskfile.yaml).

tasks:

  versions:
    desc: shows the versions from versions.env
    aliases: [v]
    silent: true
    cmds:
      - echo "METABASE_VERSION=$METABASE_VERSION"
      - echo "OPENREFINE_VERSION=$OPENREFINE_VERSION"
      - echo "WORDPRESS_VERSION=$WORDPRESS_VERSION"
      - echo "WORDPRESS_CLI_VERSION=$WORDPRESS_CLI_VERSION"
      - echo "POSTGRESQL_VERSION=$POSTGRESQL_VERSION"
      - echo "PGADMIN4_VERSION=$PGADMIN4_VERSION"
      - echo "MARIADB_VERSION=$MARIADB_VERSION"
      - echo "SQLMATE_VERSION=$SQLMATE_VERSION (from $SQLMATE_SOURCE)"
      - echo "SURVEYLITE_VERSION=$SURVEYLITE_VERSION (from $SURVEYLITE_SOURCE)"
      - echo "COMPOSE_PROFILES=$COMPOSE_PROFILES (optional services that start)"

  update-all:
    desc: gets all service images (pulls, builds OpenRefine)
    aliases: [u]
    cmds:
      - task: pull-metabase
      - task: pull-wordpress
      - task: build-openrefine
      - task: pull-postgresql
      - task: pull-pgadmin4
      - task: pull-mariadb
      # optional services: only if their profile is in COMPOSE_PROFILES

  build-openrefine:
    desc: builds the OpenRefine image
    preconditions:
      - sh: test -n "$OPENREFINE_VERSION"
        msg: "OPENREFINE_VERSION is not set: check versions.env"
    cmds:
      - docker build --build-arg OPENREFINE_VERSION=$OPENREFINE_VERSION -t openrefine:$OPENREFINE_VERSION provision/openrefine

  pull-metabase:
    desc: downloads the Metabase image
    preconditions:
      - sh: test -n "$METABASE_VERSION"
        msg: "METABASE_VERSION is not set: check versions.env"
    cmds:
      - docker pull metabase/metabase:$METABASE_VERSION

  pull-wordpress:
    desc: downloads the WordPress images
    preconditions:
      - sh: test -n "$WORDPRESS_VERSION" && test -n "$WORDPRESS_CLI_VERSION"
        msg: "WORDPRESS_VERSION or WORDPRESS_CLI_VERSION is not set: check versions.env"
    cmds:
      - docker pull wordpress:$WORDPRESS_VERSION
      - docker pull wordpress:$WORDPRESS_CLI_VERSION

  pull-postgresql:
    desc: downloads the PostgreSQL image
    preconditions:
      - sh: test -n "$POSTGRESQL_VERSION"
        msg: "POSTGRESQL_VERSION is not set: check versions.env"
    cmds:
      - docker pull postgres:$POSTGRESQL_VERSION

  pull-pgadmin4:
    desc: downloads the pgAdmin 4 image
    preconditions:
      - sh: test -n "$PGADMIN4_VERSION"
        msg: "PGADMIN4_VERSION is not set: check versions.env"
    cmds:
      - docker pull dpage/pgadmin4:$PGADMIN4_VERSION

  pull-mariadb:
    desc: downloads the MariaDB image
    preconditions:
      - sh: test -n "$MARIADB_VERSION"
        msg: "MARIADB_VERSION is not set: check versions.env"
    cmds:
      - docker pull mariadb:$MARIADB_VERSION

  build-sqlmate:
    desc: builds the sqlmate image from SQLMATE_SOURCE
    preconditions:
      - sh: test -n "$SQLMATE_VERSION" && test -n "$SQLMATE_SOURCE"
        msg: "SQLMATE_VERSION or SQLMATE_SOURCE is not set: check versions.env"
      - sh: test -f "$SQLMATE_SOURCE/Dockerfile"
        msg: "No sqlmate in SQLMATE_SOURCE: clone it there (git repository of sqlmate)"
    cmds:
      - docker build -t sqlmate:$SQLMATE_VERSION "$SQLMATE_SOURCE"

  build-surveylite:
    desc: builds the SurveyLite image from SURVEYLITE_SOURCE
    preconditions:
      - sh: test -n "$SURVEYLITE_VERSION" && test -n "$SURVEYLITE_SOURCE"
        msg: "SURVEYLITE_VERSION or SURVEYLITE_SOURCE is not set: check versions.env"
      - sh: test -f "$SURVEYLITE_SOURCE/Dockerfile"
        msg: "No SurveyLite in SURVEYLITE_SOURCE: clone it there (git repository of SurveyLite)"
    cmds:
      - docker build -t surveylite:$SURVEYLITE_VERSION "$SURVEYLITE_SOURCE"
