version: '3'

tasks:

  up:
    desc: starts the sandbox container
    silent: true
    aliases: [u]
    cmds:
      - docker compose -f compose-claude.yaml up -d

  down:
    desc: stops the sandbox container
    silent: true
    aliases: [d]
    cmds:
      - docker compose -f compose-claude.yaml down

  shell:
    desc: opens a shell in the sandbox container
    silent: true
    aliases: [s]
    cmds:
      - docker compose -f compose-claude.yaml exec claude-code /bin/bash
