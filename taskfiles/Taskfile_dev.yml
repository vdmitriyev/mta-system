version: '3'

# Development in Docker: the app (auto-reload) behind nginx, with PostgreSQL, pgAdmin 4, Metabase and OpenRefine.
# compose.yml mounts the project folder: code changes restart the app.

vars:
  DEV_ENV_FILE: envs/webapp-dev-docker.env
  DEV_COMPOSE: ENV_FILE_NAME={{.DEV_ENV_FILE}} docker compose -f compose.yml -f compose.services.yml

tasks:

  up:
    desc: builds and starts the app, nginx and the services (app on http://127.0.0.1:5252)
    aliases: [u]
    preconditions:
      - sh: test -f {{.DEV_ENV_FILE}}
        msg: "{{.DEV_ENV_FILE}} is missing. Run 'task app:init-env' first"
    cmds:
      - mkdir -p .logs/nginx .htpasswd_nginx certbot/www certbot/conf
      - "{{.DEV_COMPOSE}} up -d --build"

  down:
    desc: stops and removes the containers (the volumes are kept)
    aliases: [d]
    cmds:
      - "{{.DEV_COMPOSE}} down"

  restart:
    desc: restarts the containers
    cmds:
      - "{{.DEV_COMPOSE}} restart {{.CLI_ARGS}}"

  ps:
    desc: shows the state of the containers
    cmds:
      - "{{.DEV_COMPOSE}} ps"

  logs:
    desc: shows the logs as they come in (one service after --, e.g. '-- webapp')
    aliases: [l]
    cmds:
      - "{{.DEV_COMPOSE}} logs -f {{.CLI_ARGS}}"

  cli:
    desc: runs a command of the app in its container (e.g. 'task dev:cli -- db-upgrade')
    cmds:
      - "{{.DEV_COMPOSE}} exec webapp python -m app.cli {{.CLI_ARGS}}"

  init:
    desc: creates the SQLite database, imports the exercises and creates the demo database
    aliases: [i]
    cmds:
      - "{{.DEV_COMPOSE}} exec webapp python -m app.cli db-upgrade"
      - "{{.DEV_COMPOSE}} exec webapp python -m app.cli import-data-exercises"
      - "{{.DEV_COMPOSE}} exec webapp python -m app.cli create-demo-db"
