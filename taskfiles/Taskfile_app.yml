version: '3'

tasks:

  install:
    desc: installs the dependencies from pyproject.toml (into the active virtual environment, else {{.VENV_DIR}})
    aliases: [i]
    cmds:
      - uv sync --active

  install-dev:
    desc: installs the dependencies and the development tools from pyproject.toml
    aliases: [id]
    cmds:
      - uv sync --active --group dev

  check-virtualenv:
    desc: checks that a Python virtual environment is active
    aliases: [cv]
    silent: true
    run: once
    cmds:
      - python -c "import sys; sys.exit(0 if sys.prefix != sys.base_prefix else 'No active virtual environment. Run task app:install and activate {{.VENV_DIR}}')"
      - python -c "import sys; print('Virtual environment->', sys.prefix)"
      - python --version

  init-env:
    desc: copies the sample env files and exercises to envs/ and setup/ (keeps existing files)
    cmds:
      - mkdir -p envs setup
      - cp -n samples/webapp.env envs/webapp-dev-local.env
      - cp -n samples/webapp.env envs/webapp-dev-docker.env
      - cp -n samples/postgresql-service.env envs/postgresql-service.env
      - cp -n samples/pgadmin4-service.env envs/pgadmin4-service.env
      - cp -n samples/initial_exercises.csv setup/initial_exercises.csv
      - echo "Change the secrets in envs/ before you use them"

  serve:
    desc: runs the app for development and reloads on code changes (other port, e.g. 'PORT=8000 task app:serve')
    aliases: [r]
    deps: [check-virtualenv]
    silent: true
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    vars:
      HOST: '{{.HOST | default "127.0.0.1"}}'
      PORT: '{{.PORT | default "5353"}}'
    cmds:
      - echo "Run mta-system-> http://{{.HOST}}:{{.PORT}} (settings-> {{.ENV_FILE_NAME}})"
      - uvicorn run:app --reload --host={{.HOST}} --port={{.PORT}}

  start:
    desc: runs the app like in production, without reload (e.g. 'WORKERS=4 task app:start')
    deps: [check-virtualenv]
    silent: true
    vars:
      HOST: '{{.HOST | default "127.0.0.1"}}'
      PORT: '{{.PORT | default "5353"}}'
      WORKERS: '{{.WORKERS | default "1"}}'
    cmds:
      - echo "Run mta-system-> http://{{.HOST}}:{{.PORT}} (settings-> {{.ENV_FILE_NAME}})"
      - uvicorn run:app --host={{.HOST}} --port={{.PORT}} --workers={{.WORKERS}}

  cli:
    desc: runs a command of the app (e.g. 'task app:cli -- --help' or '-- create-custom-db')
    deps: [check-virtualenv]
    interactive: true
    cmds:
      - python -m app.cli {{.CLI_ARGS}}

  config:
    desc: checks the settings and shows them without secrets
    aliases: [c]
    deps: [check-virtualenv]
    silent: true
    cmds:
      - python -m app.cli show-config

  test:
    desc: runs the tests (pytest options after --, e.g. 'task app:test -- -v -s' or '-- -k login')
    aliases: [t]
    deps: [check-virtualenv]
    cmds:
      - python -m pytest {{.CLI_ARGS}}

  coverage:
    desc: runs the tests and shows the lines of app/ that no test runs
    deps: [check-virtualenv]
    cmds:
      - python -m pytest --cov=app --cov-report=term-missing {{.CLI_ARGS}}

  nginx-config:
    desc: creates the nginx config parts for OpenRefine and NiFi (options after --, e.g. '-- -n 50')
    deps: [check-virtualenv]
    cmds:
      - python -m app.cli nginx-config {{.CLI_ARGS}}

  bandit:
    desc: runs bandit (static code analysis)
    deps: [check-virtualenv]
    cmds:
      - bandit -r app

  build-image:
    desc: builds the Docker image of the app (mta-system:latest)
    aliases: [b]
    cmds:
      - docker build -t mta-system:latest .
