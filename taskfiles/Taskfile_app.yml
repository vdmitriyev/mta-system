version: '3'

tasks:

  install:
    desc: installs the app dependencies
    aliases: [i]
    cmds:
      - uv sync --active

  install-dev:
    desc: installs the dependencies and dev tools
    aliases: [id]
    cmds:
      - uv sync --active --group dev

  check-virtualenv:
    desc: checks that a virtual environment is active
    aliases: [cv]
    silent: true
    run: once
    cmds:
      - python -c "import sys; sys.exit(0 if sys.prefix != sys.base_prefix else 'No active virtual environment. Run task app:install and activate {{.VENV_DIR}}')"
      - python -c "import sys; print('Virtual environment->', sys.prefix)"
      - python --version

  init-env:
    desc: copies the samples to envs/ and setup/ (keeps existing files)
    cmds:
      - mkdir -p envs setup
      - cp -n samples/webapp.env envs/webapp-dev-local.env
      - cp -n samples/webapp.env envs/webapp-dev-docker.env
      - cp -n samples/postgresql-service.env envs/postgresql-service.env
      - cp -n samples/pgadmin4-service.env envs/pgadmin4-service.env
      # shared secret of nginx and pgAdmin 4: a random value, kept if the file exists
      - test -f envs/pgadmin4-proxy.env || sed "s/<CHANGE-ME>/$(python3 -c 'import secrets; print(secrets.token_hex(32))')/" samples/pgadmin4-proxy.env > envs/pgadmin4-proxy.env
      - cp -n samples/sqlmate-service.env envs/sqlmate-service.env
      - cp -n samples/surveylite-service.env envs/surveylite-service.env
      - mkdir -p setup/sqlmate setup/surveylite
      # demo exercise: sqlmate does not start without setup/sqlmate/sql-exercises.yaml
      - cp -rn samples/sqlmate/. setup/sqlmate/
      - cp -n samples/initial_exercises.csv setup/initial_exercises.csv
      - echo "Change the secrets in envs/ before you use them"

  serve:
    desc: runs the app with reload (PORT=8000 for another port)
    aliases: [r]
    deps: [check-virtualenv]
    silent: true
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    vars:
      HOST: '{{.HOST | default "127.0.0.1"}}'
      PORT: '{{.PORT | default "5353"}}'
    cmds:
      - echo "Run mta-system-> http://{{.HOST}}:{{.PORT}} (settings-> {{.ENV_FILE_NAME}})"
      - uvicorn run:app --reload --host={{.HOST}} --port={{.PORT}}

  start:
    desc: runs the app without reload (WORKERS=4 for more workers)
    deps: [check-virtualenv]
    silent: true
    vars:
      HOST: '{{.HOST | default "127.0.0.1"}}'
      PORT: '{{.PORT | default "5353"}}'
      WORKERS: '{{.WORKERS | default "1"}}'
    cmds:
      - echo "Run mta-system-> http://{{.HOST}}:{{.PORT}} (settings-> {{.ENV_FILE_NAME}})"
      - uvicorn run:app --host={{.HOST}} --port={{.PORT}} --workers={{.WORKERS}}

  cli:
    desc: "runs a command of the app (task app:cli -- --help)"
    deps: [check-virtualenv]
    interactive: true
    cmds:
      - python -m app.cli {{.CLI_ARGS}}

  config:
    desc: checks and shows the settings
    aliases: [c]
    deps: [check-virtualenv]
    silent: true
    cmds:
      - python -m app.cli show-config

  test:
    desc: runs the tests (pytest options after --)
    aliases: [t]
    deps: [check-virtualenv]
    cmds:
      - python -m pytest {{.CLI_ARGS}}

  coverage:
    desc: shows the test coverage of app/
    deps: [check-virtualenv]
    cmds:
      - python -m pytest --cov=app --cov-report=term-missing {{.CLI_ARGS}}

  nginx-config:
    desc: creates the nginx config parts for OpenRefine and NiFi
    deps: [check-virtualenv]
    cmds:
      - python -m app.cli nginx-config {{.CLI_ARGS}}

  bandit:
    desc: runs bandit (security check)
    deps: [check-virtualenv]
    cmds:
      - bandit -r app

  build-image:
    desc: "builds the app image (mta-system:latest)"
    aliases: [b]
    cmds:
      - docker build -t mta-system:latest .
