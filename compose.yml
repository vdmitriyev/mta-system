# Development: the app with auto-reload behind nginx. Use it together with the services:
#   docker compose --env-file versions.env -f compose.yml -f compose.services.yml up -d --build
#   (or: task dev:up, which reads versions.env)
# The project folder is mounted into the container: code changes restart the app.
services:

  webapp:
    build: .
    command: uvicorn run:app --host 0.0.0.0 --port 5151 --reload --proxy-headers --forwarded-allow-ips "*"
    volumes:
      - ./:/mta-system
      - /var/run/docker.sock:/var/run/docker.sock # starts and stops the service containers
    ports:
      - "127.0.0.1:5252:5151"
    env_file:
      - ${ENV_FILE_NAME}
    environment:
      TARGET_SERVER: development
      WEB_CONCURRENCY: "1"
      ENV_FILE_NAME: ${ENV_FILE_NAME}
      TZ: Europe/Berlin
    depends_on:
      postgresql-service:
        condition: service_started
      pgadmin4-service:
        condition: service_started
    networks:
      - mtas-network

  nginx:
    build: ./provision/nginx
    image: mta-system-nginx:dev
    env_file:
      # shared secret with pgAdmin 4 (task app:init-env creates the file)
      - path: envs/pgadmin4-proxy.env
        required: false
    volumes:
      - ./provision/nginx/nginx_part_openrefine.config:/etc/nginx/conf.d/nginx_part_openrefine.config:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
      - ./.logs/nginx:/var/log/nginx
      - ./.htpasswd_nginx:/.htpasswd_nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      - webapp
    networks:
      - mtas-network

  postgresql-service:
    ports:
      - "127.0.0.1:5432:5432"

networks:
  mtas-network:
    driver: bridge
    # Set the MTU to the value of your network, if packages cannot be downloaded
    # inside the containers. Default is 1500.
    # driver_opts:
    #   com.docker.network.driver.mtu: 1450
