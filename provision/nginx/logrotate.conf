# Cleans up the nginx log files of compose.prod.yaml on the host (logrotate).
# To install it, run these commands in the mta-system folder:
#   sudo cp provision/nginx/logrotate.conf /etc/logrotate.d/mta-system-nginx
#   sudo sed -i "s#/opt/mta-system#$(pwd)#g" /etc/logrotate.d/mta-system-nginx
/opt/mta-system/.logs/nginx/*.log {
    weekly
    rotate 52
    missingok
    notifempty
    compress
    delaycompress
    # nginx keeps the files open. copytruncate empties them in place, so nginx
    # does not need a restart.
    copytruncate
}
