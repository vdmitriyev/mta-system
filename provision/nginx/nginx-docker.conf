upstream webapp {
	server webapp:5151;
}


upstream pgadmin4 {
    server pgadmin4-service:80;
}


map $1 $new_value {
	~^(.*)/$ $1;
	default $1;
}

map $1 $new_value2 {
	default $1;
}


map $1 $first_part2 {
	"~^(?<first_part>[^/]+)/" $first_part;
}

log_format custom_format '$remote_addr - $remote_user [$time_local] '
						'"$request" $status $body_bytes_sent '
						'"$http_referer" "$http_user_agent" '
						'"$new_value" '
						'"$new_value2" '
						'"$first_part2"';

server {

	listen 80;
	server_name _;

	location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }



	if ($host = nginx) {
        return 301 https://$host$request_uri;
    }


    return 404;
}

server {

	listen                  443 ssl;
    listen                  [::]:443 ssl;

	#error_log 				/var/log/nginx/error.log debug;
	#access_log 			/var/log/nginx/access.log custom_format;

	error_log 				/var/log/nginx/error.log;
	access_log				/var/log/nginx/access.log;


    ssl_certificate         /etc/nginx/conf.d/local-cert.pem;
    ssl_certificate_key     /etc/nginx/conf.d/local-key.pem;

    # When certbot has a certificate for your host (task prod:cert), use these
    # two lines instead and run: task prod:reload
    #ssl_certificate /etc/nginx/ssl/live/<FQDN>/fullchain.pem;
    #ssl_certificate_key /etc/nginx/ssl/live/<FQDN>/privkey.pem;


	client_max_body_size 64M;

	location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {

		proxy_connect_timeout 240;
		proxy_read_timeout 240;
		proxy_send_timeout 240;

        proxy_pass http://webapp;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }


	#
	# this will not work on localhost, unless port 80 is used
	#
	location /pgadmin4/ {

		auth_basic "Restricted Content";
		auth_basic_user_file /.htpasswd_nginx/common-basic-auth.db;

		resolver 127.0.0.11;

		proxy_pass http://pgadmin4;

		proxy_set_header X-Script-Name /pgadmin4;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-User $remote_user;
		proxy_redirect off;
    }

	#
	# configure reverse proxy for all metabase containers (multiple)
	#
	location ~* ^/metabase/(.*) {
		resolver 127.0.0.11;

		proxy_pass http://metabase-$1;

		proxy_redirect off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $server_name;
	}

	#
	# configure reverse proxy for all wordpress containers (multiple)
	#
	location ~* ^/wordpress/(.*) {
		resolver 127.0.0.11;

		#proxy_pass http://wordpress-$1:80$is_args$args;
		proxy_pass http://wordpress-$1$is_args$args;

		proxy_set_header Host 				$http_host;
		proxy_set_header X-Real-IP 			$remote_addr;
		proxy_set_header X-Forwarded-Host 	$http_host;
		proxy_set_header X-Forwarded-For 	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto 	$scheme;
	}


	include /etc/nginx/conf.d/nginx_part_openrefine.config;

}
