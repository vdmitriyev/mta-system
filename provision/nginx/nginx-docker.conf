upstream webapp {
	server webapp:5151;
}


map $1 $new_value {
	~^(.*)/$ $1;
	default $1;
}

map $1 $new_value2 {
	default $1;
}


map $1 $first_part2 {
	"~^(?<first_part>[^/]+)/" $first_part;
}

log_format custom_format '$remote_addr - $remote_user [$time_local] '
						'"$request" $status $body_bytes_sent '
						'"$http_referer" "$http_user_agent" '
						'"$new_value" '
						'"$new_value2" '
						'"$first_part2"';

server {

	listen 80;
	listen [::]:80;
	server_name _;

	# Let's Encrypt (task prod:cert): certbot writes the challenge files to
	# certbot/www, nginx serves them here. A "return" at server level would run
	# before this location, so all other requests are redirected in "location /".
	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {

	listen                  443 ssl;
    listen                  [::]:443 ssl;

	#error_log 				/var/log/nginx/error.log debug;
	#access_log 			/var/log/nginx/access.log custom_format;

	error_log 				/var/log/nginx/error.log;
	access_log				/var/log/nginx/access.log;


    ssl_certificate         /etc/nginx/conf.d/local-cert.pem;
    ssl_certificate_key     /etc/nginx/conf.d/local-key.pem;

    # When certbot has a certificate for your host (task prod:cert), use these
    # two lines instead. This file is part of the nginx image: run
    # task prod:nginx-recreate to build the image again and recreate nginx.
    #ssl_certificate /etc/nginx/ssl/live/<FQDN>/fullchain.pem;
    #ssl_certificate_key /etc/nginx/ssl/live/<FQDN>/privkey.pem;


	client_max_body_size 64M;

	location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {

		proxy_connect_timeout 240;
		proxy_read_timeout 240;
		proxy_send_timeout 240;

        proxy_pass http://webapp;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }


	#
	# pgAdmin 4. nginx checks the login (basic auth) and passes the name on
	# (X-Forwarded-User). pgAdmin builds its links with /pgadmin4 (X-Script-Name).
	#
	location = /pgadmin4 {
		# relative address: keeps the port of the user (HTTPS_PORT)
		absolute_redirect off;
		return 301 /pgadmin4/;
	}

	location /pgadmin4/ {

		auth_basic "Restricted Content";
		auth_basic_user_file /.htpasswd_nginx/common-basic-auth.db;

		# The address is looked up at each request: a new pgAdmin container
		# gets a new address, and nginx also starts without pgAdmin.
		resolver 127.0.0.11 valid=30s;
		set $pgadmin4_upstream http://pgadmin4-service:80;
		proxy_pass $pgadmin4_upstream;

		# HTTPS and the port of the user: pgAdmin redirects to https://<host>[:port]/pgadmin4/...
		proxy_set_header X-Script-Name /pgadmin4;
		proxy_set_header X-Scheme $scheme;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-User $remote_user;
		# shared secret: pgAdmin accepts X-Forwarded-User only with it (envs/pgadmin4-proxy.env)
		proxy_set_header X-Pgadmin-Webserver-Secret "${PGADMIN_WEBSERVER_SECRET}";
		proxy_redirect off;
	}

	#
	# configure reverse proxy for all metabase containers (multiple)
	#
	location ~* ^/metabase/(.*) {
		resolver 127.0.0.11;

		proxy_pass http://metabase-$1;

		proxy_redirect off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $server_name;
	}

	#
	# configure reverse proxy for all wordpress containers (multiple)
	#
	location ~* ^/wordpress/(.*) {
		resolver 127.0.0.11;

		#proxy_pass http://wordpress-$1:80$is_args$args;
		proxy_pass http://wordpress-$1$is_args$args;

		proxy_set_header Host 				$http_host;
		proxy_set_header X-Real-IP 			$remote_addr;
		proxy_set_header X-Forwarded-Host 	$http_host;
		proxy_set_header X-Forwarded-For 	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto 	$scheme;
	}


	#
	# sqlmate (SQL exercises). It runs with the URL prefix "sqlmate/" (SM_URL_PREFIX).
	# The address is looked up at each request: nginx also starts without sqlmate.
	#
	location /sqlmate/ {
		resolver 127.0.0.11 valid=30s;
		set $sqlmate_upstream http://sqlmate-service:5353;
		proxy_pass $sqlmate_upstream;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}


	#
	# SurveyLite (anonymous surveys). It runs with the URL prefix /surveylite
	# (SURVEYLITE_URL_PREFIX in compose.services.yml), so the path is passed on as it is.
	#
	location = /surveylite {
		return 301 /surveylite/;
	}

	location /surveylite/ {
		resolver 127.0.0.11 valid=30s;
		set $surveylite_upstream http://surveylite-service:5001;
		proxy_pass $surveylite_upstream;

		# survey YAML uploads in the admin pages of SurveyLite
		client_max_body_size 16M;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_redirect off;
	}


	include /etc/nginx/conf.d/nginx_part_openrefine.config;

}
