; Cron jobs (compose.prod.yaml, service "cronjobs-ofelia"). After a change: task prod:restart-cronjobs
;
; Each night: stop the running Metabase and OpenRefine containers of the users (frees RAM
; and CPU). The users start them again with "Start service" on the page Services.
; Schedule: seconds minutes hours day month weekday, in the time zone TZ of ofelia.
[job-exec "stop-user-containers"]
schedule = 0 15 3 * * *
container = mta-system-app
command = python -m app.cli stop-containers
no-overlap = true
