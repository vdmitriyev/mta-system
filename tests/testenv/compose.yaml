# Test copy of mta-system next to the real "mta-system" project: the app, PostgreSQL,
# pgAdmin 4, MariaDB, and the containers of each user (Metabase, OpenRefine, WordPress)
# that the app starts through the Docker socket. The deprecated services (JupyterHub,
# NiFi, Superset) are not part of it.
#
# Network variant "names" (this file): the app reaches the containers of the users by
# their names in the network of the project, as nginx does in production. Their names
# start with "mtas-testenv-" and they publish no ports, so they cannot clash with other
# containers. Variant "host ports": compose.hostports.yaml on top of this file.
# Used by taskfiles/Taskfile_testenv.yaml with --project-directory set to the project folder,
# which also sets the ports (MTAS_APP_PORT, MTAS_DB_PORT).
# MTAS_HOST_DIR: project folder as the Docker daemon sees it (see host_dir.py)
services:

  app:
    build: .
    env_file:
      - ${ENV_FILE_NAME:-envs/webapp-dev-docker.env}
    environment:
      TARGET_SERVER: production
      SESSION_COOKIE_SECURE: "false" # the test copy has no HTTPS
      TZ: Europe/Berlin
      POSTGRESQL_DB_HOST: database
      POSTGRESQL_DB_HOST_PORT: "5432"
      POSTGRESQL_ADMIN_USER: postgres
      POSTGRESQL_ADMIN_PASSWORD: testenv-postgres # sandbox only, same as in "database"
      MARIADB_DB_HOST: mariadb
      MARIADB_DB_HOST_PORT: "3306"
      MARIADB_ADMIN_USER: root
      MARIADB_ADMIN_PASSWORD: testenv-mariadb # sandbox only, same as in "mariadb"
      # containers of the users
      DOCKER_NETWORK_NAME: mtas-testenv_mtas-network
      CONTAINER_NAME_PREFIX: mtas-testenv-
      CONTAINER_PUBLISH_PORTS: "false"
      METABASE_BASE_URL: http://mtas-testenv-metabase-
      METABASE_TRY_COUNT: "20"
      METABASE_TRY_SLEEP_SEC: "15"
      # for tests/testenv/services_check.py
      MTAS_PGADMIN4_URL: http://pgadmin4
      MTAS_PGADMIN4_SECRET: testenv-pgadmin-secret # sandbox only, same as in "pgadmin4" and "nginx"
      MTAS_NGINX_URL: https://nginx
      # sqlmate and SurveyLite
      SQLMATE_API_URL: http://sqlmate-service:5353/sqlmate/api/v1
      SQLMATE_API_KEY: smk_testenv-sqlmate-key-sandbox-only-0123 # see sqlmate-service
      SQLMATE_URL: https://localhost/sqlmate/
      SURVEYLITE_API_URL: http://surveylite-service:5001/api/v1
      SURVEYLITE_API_KEY: testenv-surveylite-key # sandbox only, see surveylite-service
      SURVEYLITE_URL: https://localhost/surveylite/
    volumes:
      - app-data:/mta-system/data # own SQLite database
      - htpasswd:/mta-system/.htpasswd_nginx # logins for nginx (basic auth), as in production
      - /var/run/docker.sock:/var/run/docker.sock # starts the containers of the users
      - ${MTAS_HOST_DIR:-.}/.logs/testenv:/mta-system/.logs
      - ${MTAS_HOST_DIR:-.}/setup:/mta-system/setup:ro
    ports:
      - "127.0.0.1:${MTAS_APP_PORT:-5354}:5151"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5151/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 6
    depends_on:
      database:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    networks:
      mtas-network:
        # the name in the nginx configuration of production
        aliases: [webapp]

  pgadmin4:
    image: dpage/pgadmin4:${PGADMIN4_VERSION:?set it in versions.env and use task}
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mtas-testenv.org
      PGADMIN_DEFAULT_PASSWORD: testenv-pgadmin # sandbox only
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      PGADMIN_WEBSERVER_SECRET: testenv-pgadmin-secret # sandbox only (envs/pgadmin4-proxy.env)
    volumes:
      # nginx logs the users in (basic auth) and passes the name on: X-Forwarded-User
      - ${MTAS_HOST_DIR:-.}/provision/pgadmin4/config_local.py:/pgadmin4/config_local.py:ro
    networks:
      mtas-network:
        aliases: [pgadmin4-service]

  # the nginx of production (provision/nginx): checks /sqlmate/ and /surveylite/
  nginx:
    build: ./provision/nginx
    image: mtas-testenv-nginx:latest
    environment:
      PGADMIN_WEBSERVER_SECRET: testenv-pgadmin-secret # sandbox only, same as in "pgadmin4"
    volumes:
      - ${MTAS_HOST_DIR:-.}/provision/nginx/nginx_part_openrefine.config:/etc/nginx/conf.d/nginx_part_openrefine.config:ro
      - htpasswd:/.htpasswd_nginx:ro
    ports:
      - "127.0.0.1:${MTAS_NGINX_PORT:-38443}:443"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mtas-network

  # sqlmate and its database, as in provision/sqlmate/compose.yml
  sqlmate-service:
    build: ./temp/sqlmate # source of sqlmate, as in task services:build-sqlmate
    image: sqlmate:${SQLMATE_VERSION:?set it in versions.env and use task}
    command: gunicorn --config gunicorn.config.docker.prod.py run:app
    environment:
      FLASK_APP: run.py
      TARGET_SERVER: prod
      SM_URL_PREFIX: sqlmate/
      SERVER_FQDN: localhost
      FLASK_SECRET_KEY: testenv-sqlmate-secret # sandbox only
      HASH_KEY_HIDDEN: testenv-sqlmate-hidden
      HASH_KEY_LINKS: testenv-sqlmate-links
      SYSTEM_ADMINS: admin@mtas-testenv.org
      POSTGRES_DB_HOST: sqlmate-database
      POSTGRES_DB_HOST_PORT: "5432"
      POSTGRES_DB: sqlmate_db
      POSTGRES_USER: sqlmate
      POSTGRES_PASSWORD: testenv-sqlmate
      SM_SANDBOX_DB_NAME: sqlmate_sandbox_db
      SM_SANDBOX_DB_USER: sqlmate_sandbox
      SM_SANDBOX_DB_PASS: testenv-sqlmate-sandbox
      SM_SANDBOX_DB_USER_READONLY: sqlmate_sandbox_ro
      SM_SANDBOX_DB_PASS_READONLY: testenv-sqlmate-sandbox-ro
      REGISTRATION_API: "True"
      REGISTRATION_WEB: "False"
      API_KEY: smk_testenv-sqlmate-key-sandbox-only-0123
    volumes:
      # the demo exercise (production: setup/sqlmate)
      - ${MTAS_HOST_DIR:-.}/samples/sqlmate:/app/data:ro
    depends_on:
      sqlmate-database:
        condition: service_healthy
    networks:
      - mtas-network

  sqlmate-database:
    image: postgres:${POSTGRESQL_VERSION:?set it in versions.env and use task}
    environment:
      POSTGRES_DB: sqlmate_db
      POSTGRES_USER: sqlmate
      POSTGRES_PASSWORD: testenv-sqlmate # sandbox only
      PGDATA: /pgdata
    volumes:
      - sqlmate-pgdata:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlmate -d sqlmate_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mtas-network

  surveylite-service:
    build: ./temp/surveylite # source of SurveyLite, as in task services:build-surveylite
    image: surveylite:${SURVEYLITE_VERSION:?set it in versions.env and use task}
    environment:
      SURVEYLITE_BASE_URL: https://localhost
      SURVEYLITE_URL_PREFIX: /surveylite
      # trust X-Forwarded-For of nginx: login limits per user address, not per nginx
      # (only nginx reaches SurveyLite: it publishes no port)
      FORWARDED_ALLOW_IPS: "*"
      SURVEYLITE_ADMIN_PASSWORD: testenv-surveylite-admin # sandbox only
      SURVEYLITE_SECRET_KEY: testenv-surveylite-secret
      SURVEYLITE_API_KEYS: testenv-surveylite-key
      SURVEYLITE_API_DOCS: "false"
      SURVEYLITE_DB_PATH: ""
    volumes:
      - surveylite-data:/app/data
    networks:
      - mtas-network

  mariadb:
    image: mariadb:${MARIADB_VERSION:?set it in versions.env and use task}
    environment:
      MARIADB_ROOT_PASSWORD: testenv-mariadb # sandbox only
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mtas-network

  database:
    # same version as the real deployment: POSTGRESQL_VERSION in versions.env
    image: postgres:${POSTGRESQL_VERSION:?set it in versions.env and use task}
    env_file:
      - envs/postgresql-service.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testenv-postgres
    ports:
      - "127.0.0.1:${MTAS_DB_PORT:-35433}:5432"
    volumes:
      - pg15volume-database:/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mtas-network

networks:
  mtas-network:

volumes:
  app-data:
  htpasswd:
  pg15volume-database:
  mariadb-data:
  sqlmate-pgdata:
  surveylite-data:
